name: verify

# zapgw's CI — runs the four verify commands (see CLAUDE.md) on every push and
# every pull request, each as its own step so the output says which one broke.
#
# Required history: T-117 (2026-08-06) tried a probe here and died twice as
# `cancelled`, empty runner, ~15min, cause never established. That's why the
# timeout-minutes below sits well under 15 — hanging becomes a named red
# instead of silence.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # At the JOB level, not a single step's: both `go test ./...` (which runs
    # the whole package, name gate included) and the gate's own step below
    # need to see the same variable (T-195).
    #
    # 🔴 Owner's decision, to revisit if it ever becomes a problem: on a PR
    # coming from a FORK, GitHub does NOT deliver secrets to the workflow —
    # so here the variable arrives empty, the name gate finds no loadable
    # needle and FAILS saying "COULD NOT VERIFY". That is correct and
    # deliberate: CI genuinely cannot verify in that context, and failing
    # closed is this house's rule (see CLAUDE.md). Do NOT swap it for a
    # skip — a skip is exactly the blindness this gate exists not to have.
    env:
      ZAPGW_FORBIDDEN_NAMES: ${{ secrets.ZAPGW_FORBIDDEN_NAMES }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # gofmt -l doesn't fail on its own: it prints the misaligned files and
        # exits 0. Non-empty output has to be turned into an explicit error —
        # and it's `cmd internal`, never `.`: agent worktrees live in
        # `.claude/`, inside the repo, and gofmt doesn't ignore a hidden
        # directory the way `go` does.
        run: |
          desalinhados="$(gofmt -l cmd internal)"
          if [ -n "$desalinhados" ]; then
            echo "gofmt found misaligned files:"
            echo "$desalinhados"
            exit 1
          fi

      - name: portao de dado pessoal
        # Its OWN step, not "bundled into go test", because here the cost is
        # irreversible: published once, there's no unpublishing. When this
        # step turns red, the output says exactly that, instead of the reader
        # having to find the line in the middle of a whole suite.
        run: go test ./internal/config/ -run TestNoPhoneNumberOutsideTheAllowlistInTheRepo -v

      - name: portao de TLS
        # Same reason: TLS has no off switch, and the test that guarantees
        # that deserves its own name on the panel.
        run: go test ./internal/inbound/ -run TLS -v

      - name: portao de nome
        # Same reason as the personal-data gate above: the needle comes from
        # the ZAPGW_FORBIDDEN_NAMES secret (see env: at the job level), NEVER
        # from a value written in this file — writing the name list here
        # would publish exactly what the gate exists to keep out.
        run: go test ./internal/config/ -run TestNoCustomerNameOutsideTheGateInTheRepo -v
